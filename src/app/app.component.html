<svg class="floating-menu-container" [attr.width]="svgWidth" [attr.height]="svgHeight" preserveAspectRatio="none">
    <path id="menu-path" fill="#ffffff" [attr.d]="svgPath" />
    <foreignObject [attr.x]="0" [attr.y]="0" [attr.width]="menuContentWidth" [attr.height]="svgHeight">

            <div class="menu-content-child">
                <div class="nav-header-tab">

                    <hr />
                </div>
