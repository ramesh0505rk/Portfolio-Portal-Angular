<app-top-bar-test class="top-bar"></app-top-bar-test>
<div class="content">
    <app-page-loader #introContainer *ngIf="loaderService.showLoader$ | async" class="intro-container"
        [contentClassName]="'pageName'" [pageTitle]="loaderService.pageTitle$ | async" [x]="0"
        [y]="200"></app-page-loader>

    <div class="main-content">
        <router-outlet />
    </div>
</div>
<div class="floating-menu" (click)="toggleMenu()">
    <img class="menu-icon" src="assets/icons/menu-white.svg" />
</div>
<svg class="floating-menu-container" [attr.width]="svgWidth" [attr.height]="svgHeight" preserveAspectRatio="none">
    <path id="menu-path" fill="#ffffff" [attr.d]="svgPath" />
</svg>
